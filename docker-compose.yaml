services:
  redis:
    image: redis:latest
    container_name: vintage-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data
  db:
    image: pgvector/pgvector:pg17
    restart: always
    container_name: vintagedb
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: vintagedb
    ports:
      - "5432:5432"
    volumes:
       - ./pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: vintage-web
    volumes:
      - .:/app
    environment:
      - DB_URL=postgres://myuser:mypassword@db:5432/vintagedb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    container_name: vintage-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
